<div class="card bg-dark text-white shadow-lg border-{{ colorClass }}">
  <div class="card-header text-center bg-opacity-25 border-{{ colorClass }} bg-{{ colorClass }}">
    <h3 class="mb-0">{{ icono }} {{ titulo }}</h3>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-dark table-hover table-striped mb-0 text-center">
        <thead>
          <tr>
            <th>#</th>
            <th *ngFor="let col of columnas">{{ col.label }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of datos; let i = index">
            <td>{{ i + 1 }}</td>
            <td *ngFor="let col of columnas">
              
              <span *ngIf="col.type === 'email'">
                {{ item[col.key]?.split('@')[0] }}
              </span>

              <span *ngIf="col.type === 'date'">
                {{ item[col.key] | date:'dd/MM HH:mm' }}
              </span>

              <span *ngIf="col.type === 'boolean'" class="badge" [ngClass]="item[col.key] ? 'bg-success' : 'bg-danger'">
                {{ item[col.key] ? 'Ganó' : 'Perdió' }}
              </span>

              <span *ngIf="!col.type" [ngClass]="{'fw-bold text-info': col.key === 'puntaje'}">
                {{ item[col.key] }}
              </span>

            </td>
          </tr>
          <tr *ngIf="!datos || datos.length === 0">
            <td [colSpan]="columnas.length + 1" class="text-center text-muted py-3">No hay partidas registradas.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
