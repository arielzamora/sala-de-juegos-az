<div class="resultados-container">
  <div class="container py-5">
    <header class="text-center mb-5">
      <h1 class="display-4 fw-bold text-gradient">Resultados Globales 🏆</h1>
      <p class="lead text-secondary">Los mejores jugadores de la sala</p>
    </header>

    <div *ngIf="cargando" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mt-3">Obteniendo rankings...</p>
    </div>

    <div *ngIf="error" class="alert alert-danger text-center">
      {{ error }}
    </div>

    <div *ngIf="!cargando && !error" class="row g-4">
      
      <div class="col-12 col-xl-6">
        <app-tabla-resultados 
          titulo="Ahorcado" 
          icono="💀" 
          colorClass="primary" 
          [datos]="resultadosAhorcado" 
          [columnas]="colsAhorcado">
        </app-tabla-resultados>
      </div>

      <div class="col-12 col-xl-6">
        <app-tabla-resultados 
          titulo="Mayor o Menor" 
          icono="🃏" 
          colorClass="info" 
          [datos]="resultadosMayorMenor" 
          [columnas]="colsMayorMenor">
        </app-tabla-resultados>
      </div>

      <div class="col-12 col-xl-6">
        <app-tabla-resultados 
          titulo="Juego de Dados" 
          icono="🎲" 
          colorClass="success" 
          [datos]="resultadosDados" 
          [columnas]="colsDados">
        </app-tabla-resultados>
      </div>

      <div class="col-12 col-xl-6">
        <app-tabla-resultados 
          titulo="Preguntados" 
          icono="❓" 
          colorClass="warning" 
          [datos]="resultadosPreguntados" 
          [columnas]="colsPreguntados">
        </app-tabla-resultados>
      </div>

    </div>
  </div>
</div>
